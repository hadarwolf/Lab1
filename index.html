<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wave Shooter</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0e14;
    overflow: hidden;
    height: 100%;
    font-family: 'Courier New', monospace;
    color: #e6e6e6;
  }
  #game {
    display: block;
    background: #11151f;
    cursor: crosshair;
  }
  #hud {
    position: fixed;
    top: 12px;
    left: 12px;
    font-size: 18px;
    text-shadow: 0 0 4px #000;
    pointer-events: none;
  }
  #hud div { margin-bottom: 4px; }
  #center-msg {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
  }
  #center-msg h1 {
    font-size: 48px;
    margin: 0;
    text-shadow: 0 0 10px #ff3355;
  }
  #center-msg p {
    font-size: 18px;
    opacity: 0.85;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="hp">HP: 100</div>
  <div id="wave">Wave: 1</div>
  <div id="score">Score: 0</div>
</div>
<div id="center-msg" class="hidden">
  <h1 id="center-title"></h1>
  <p id="center-sub"></p>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

const mouse = { x: 0, y: 0, down: false };
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
canvas.addEventListener('mousedown', () => mouse.down = true);
canvas.addEventListener('mouseup', () => mouse.down = false);

const centerMsg = document.getElementById('center-msg');
const centerTitle = document.getElementById('center-title');
const centerSub = document.getElementById('center-sub');
function showMessage(title, sub) {
  centerTitle.textContent = title;
  centerSub.textContent = sub;
  centerMsg.classList.remove('hidden');
}
function hideMessage() {
  centerMsg.classList.add('hidden');
}

const hpEl = document.getElementById('hp');
const waveEl = document.getElementById('wave');
const scoreEl = document.getElementById('score');

const player = {
  x: 0, y: 0, r: 14,
  speed: 260,
  hp: 100,
  maxHp: 100,
  fireRate: 0.12,
  fireCooldown: 0,
  alive: true
};
player.x = canvas.width / 2;
player.y = canvas.height / 2;

let bullets = [];
let enemyBullets = [];
let enemies = [];
let particles = [];

let score = 0;
let wave = 0;
let waveTransitionTimer = 0;
let gameState = 'waveIntro'; // waveIntro | playing | gameover

function dist(ax, ay, bx, by) {
  return Math.hypot(ax - bx, ay - by);
}

function spawnEnemy() {
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  const margin = 40;
  if (edge === 0) { x = -margin; y = Math.random() * canvas.height; }
  else if (edge === 1) { x = canvas.width + margin; y = Math.random() * canvas.height; }
  else if (edge === 2) { x = Math.random() * canvas.width; y = -margin; }
  else { x = Math.random() * canvas.width; y = canvas.height + margin; }

  const type = Math.random() < 0.25 ? 'shooter' : 'chaser';
  const baseHp = type === 'shooter' ? 2 : 3;
  const bonusHp = Math.floor(wave / 3);

  enemies.push({
    x, y,
    r: type === 'shooter' ? 12 : 14,
    speed: (type === 'shooter' ? 90 : 120) + wave * 4,
    hp: baseHp + bonusHp,
    maxHp: baseHp + bonusHp,
    type,
    fireCooldown: 1 + Math.random(),
    hitFlash: 0
  });
}

function startWave() {
  wave++;
  const count = 4 + wave * 2;
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      if (gameState === 'playing') spawnEnemy();
    }, i * 300);
  }
  waveEl.textContent = 'Wave: ' + wave;
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 50 + Math.random() * 150;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.4 + Math.random() * 0.3,
      maxLife: 0.4 + Math.random() * 0.3,
      color
    });
  }
}

let lastTime = performance.now();

function update(dt) {
  if (gameState === 'waveIntro') {
    waveTransitionTimer -= dt;
    if (waveTransitionTimer <= 0) {
      hideMessage();
      gameState = 'playing';
      startWave();
    }
    return;
  }

  if (gameState === 'gameover') {
    if (keys['r']) {
      resetGame();
    }
    return;
  }

  // player movement
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  const len = Math.hypot(dx, dy);
  if (len > 0) {
    dx /= len; dy /= len;
    player.x += dx * player.speed * dt;
    player.y += dy * player.speed * dt;
  }
  player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
  player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));

  // shooting
  player.fireCooldown -= dt;
  if (mouse.down && player.fireCooldown <= 0) {
    player.fireCooldown = player.fireRate;
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    bullets.push({
      x: player.x + Math.cos(angle) * player.r,
      y: player.y + Math.sin(angle) * player.r,
      vx: Math.cos(angle) * 620,
      vy: Math.sin(angle) * 620,
      r: 4
    });
  }

  // player bullets
  bullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });
  bullets = bullets.filter(b => b.x > -20 && b.x < canvas.width + 20 && b.y > -20 && b.y < canvas.height + 20);

  // enemies
  enemies.forEach(e => {
    const angle = Math.atan2(player.y - e.y, player.x - e.x);
    if (e.type === 'chaser') {
      e.x += Math.cos(angle) * e.speed * dt;
      e.y += Math.sin(angle) * e.speed * dt;
    } else {
      // shooter: keep distance, strafe
      const d = dist(e.x, e.y, player.x, player.y);
      if (d > 260) {
        e.x += Math.cos(angle) * e.speed * dt;
        e.y += Math.sin(angle) * e.speed * dt;
      } else if (d < 180) {
        e.x -= Math.cos(angle) * e.speed * dt;
        e.y -= Math.sin(angle) * e.speed * dt;
      } else {
        e.x += Math.cos(angle + Math.PI / 2) * e.speed * 0.5 * dt;
        e.y += Math.sin(angle + Math.PI / 2) * e.speed * 0.5 * dt;
      }
      e.fireCooldown -= dt;
      if (e.fireCooldown <= 0) {
        e.fireCooldown = 1.4 + Math.random() * 0.8;
        enemyBullets.push({
          x: e.x, y: e.y,
          vx: Math.cos(angle) * 320,
          vy: Math.sin(angle) * 320,
          r: 5
        });
      }
    }
    if (e.hitFlash > 0) e.hitFlash -= dt;
  });

  // enemy bullets
  enemyBullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });
  enemyBullets = enemyBullets.filter(b => b.x > -20 && b.x < canvas.width + 20 && b.y > -20 && b.y < canvas.height + 20);

  // collisions: player bullets vs enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (dist(e.x, e.y, b.x, b.y) < e.r + b.r) {
        bullets.splice(j, 1);
        e.hp -= 1;
        e.hitFlash = 0.1;
        spawnParticles(b.x, b.y, '#ffd24a', 4);
        if (e.hp <= 0) {
          spawnParticles(e.x, e.y, e.type === 'shooter' ? '#ff6b6b' : '#6bffb0', 16);
          score += e.type === 'shooter' ? 150 : 100;
          scoreEl.textContent = 'Score: ' + score;
          enemies.splice(i, 1);
        }
        break;
      }
    }
  }

  // collisions: enemy bullets vs player
  for (let j = enemyBullets.length - 1; j >= 0; j--) {
    const b = enemyBullets[j];
    if (dist(player.x, player.y, b.x, b.y) < player.r + b.r) {
      enemyBullets.splice(j, 1);
      player.hp -= 8;
      spawnParticles(b.x, b.y, '#ff3355', 6);
    }
  }

  // collisions: enemies vs player (melee)
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (dist(player.x, player.y, e.x, e.y) < player.r + e.r) {
      player.hp -= 25 * dt;
    }
  }

  hpEl.textContent = 'HP: ' + Math.max(0, Math.ceil(player.hp));

  if (player.hp <= 0) {
    player.hp = 0;
    gameState = 'gameover';
    showMessage('GAME OVER', 'Score: ' + score + ' — Press R to restart');
  }

  // particles
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.92;
    p.vy *= 0.92;
    p.life -= dt;
  });
  particles = particles.filter(p => p.life > 0);

  // wave clear check
  if (enemies.length === 0 && gameState === 'playing') {
    gameState = 'waveIntro';
    waveTransitionTimer = 1.8;
    showMessage('WAVE ' + (wave + 1), 'Get ready...');
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // grid background
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  const gridSize = 40;
  for (let x = 0; x < canvas.width; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // particles
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // player bullets
  ctx.fillStyle = '#ffd24a';
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // enemy bullets
  ctx.fillStyle = '#ff3355';
  enemyBullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // enemies
  enemies.forEach(e => {
    ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : (e.type === 'shooter' ? '#ff6b6b' : '#6bffb0');
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fill();
    // hp bar
    const barW = e.r * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(e.x - barW / 2, e.y - e.r - 10, barW, 4);
    ctx.fillStyle = '#fff';
    ctx.fillRect(e.x - barW / 2, e.y - e.r - 10, barW * Math.max(0, e.hp / e.maxHp), 4);
  });

  // player
  if (player.hp > 0) {
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(angle);
    ctx.fillStyle = '#4ad1ff';
    ctx.beginPath();
    ctx.moveTo(player.r + 6, 0);
    ctx.lineTo(-player.r, player.r * 0.8);
    ctx.lineTo(-player.r, -player.r * 0.8);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function resetGame() {
  player.hp = player.maxHp;
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;
  bullets = [];
  enemyBullets = [];
  enemies = [];
  particles = [];
  score = 0;
  wave = 0;
  scoreEl.textContent = 'Score: 0';
  hpEl.textContent = 'HP: ' + player.maxHp;
  gameState = 'waveIntro';
  waveTransitionTimer = 1.8;
  showMessage('WAVE 1', 'Get ready...');
}

function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

showMessage('WAVE 1', 'WASD to move, mouse to aim, click to shoot');
waveTransitionTimer = 2.2;
requestAnimationFrame(loop);
</script>
</body>
</html>
